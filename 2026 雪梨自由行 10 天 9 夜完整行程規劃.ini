### 📅 Day 3：2026/09/29（一）自駕啟程！深入藍山與奇幻藍光螢火蟲
* **主題**：壯麗峽谷、雨林纜車與神秘藍光洞穴
* **住宿地點**：藍山 Leura / Katoomba 2房2廳包棟公寓

#### 🕒 詳細時間表
* **08:30 – 10:30** 🚗 **自駕前往藍山小鎮 Leura**（車程約 1.5–2 小時）。
* **10:30 – 12:00** 📸 **景點 1：Leura 蘿拉小鎮散步**
  * **特色**：充滿英式鄉村風情的小鎮，春季滿是花卉，非常適合拍照。
* **12:00 – 13:30** 🍽️ **午餐：Wayzgoose Cafe (Leura)**
  * **餐點特色**：著名司康（Scone）搭配 Devonshire Tea、雞肉蘑菇帕尼尼（Chicken Panini）。
  * **預算**：約 AUD $20–$30 / 人。
* **14:00 – 17:00** 📸 **景點 2：藍山國家公園 Scenic World & 三姊妹岩（Echo Point）** ⚠️ *門票需預約*
  * **停留時間**：3 小時。
  * **特色**：乘坐全球最陡峭的紅色森林火車（Railway）、觀景纜車（Skyway），並至 Echo Point 拍攝三姊妹岩絕景。
* **17:30 – 20:00** 📸 **景點 3：Glow Worm Tunnel（螢火蟲洞）尋祕**
  * **交通方式**：自駕前往藍山深處觀賞點（約 40 分鐘車程）。
  * **注意事項**：請自備手電筒或頭燈，進入洞內關燈即可看見密密麻麻的藍光螢火蟲（⚠️ *嚴禁使用強光照射螢火蟲*）。
* **20:30 – 22:00** 🍽️ **晚餐：藍山公寓自煮海鮮火鍋 / 享用在地披薩**
  * 使用超市採買的食材，4 人在 2房2廳公寓開派對放鬆。

* **🚗 交通安排**：全程自駕（Vicky 車輛）。
* **💰 當日預估花費**：約 AUD $90–$120 / 人（包含 Scenic World 纜車套票約 AUD $55）。
* **📌 備註提醒**：山區氣溫較市區低 5°C–8°C，請準備保暖風衣；進入螢火蟲洞穿著防滑路跑鞋。

