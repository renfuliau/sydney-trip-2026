### 📅 Day 7：2026/10/03（六）重返雪梨！岩石區市集與港灣大橋夜景
* **主題**：週末市集挖寶、人文大樓與港灣大橋漫步
* **住宿地點**：Vicky 市區家（雪梨市區）

#### 🕒 詳細時間表
* **08:30 – 10:30** 🚗 **自駕返回雪梨市區**（車程約 2 小時），車停 Vicky 家。
* **11:00 – 13:30** 📸 **景點 1：The Rocks Markets（岩石區市集）& 午餐**
  * **特色**：僅每週六日開放！手作木雕、香氛、原住民藝術品與街頭美食。
  * **午餐**：市集攤位的烤豬肉刈包、手工法式可麗餅。
  * **預算**：約 AUD $20–$30 / 人。
* **14:00 – 16:30** 📸 **景點 2：雪梨大學（University of Sydney）**
  * **交通方式**：公車/搭車前往（約 20 分鐘）。
  * **停留時間**：2.5 小時。
  * **特色**：參觀被譽為「哈利波特樓」的砂岩哥德式 Quadrangle 大樓，拍照超級出片！
* **17:30 – 19:30** 📸 **景點 3：雪梨港灣大橋（Sydney Harbour Bridge）黃昏步行**
  * **停留時間**：1.5–2 小時。
  * **特色**：從岩石區端登上大橋行人步道，一路漫步至 Milsons Point，欣賞夕陽餘暉下的雪梨天際線。
* **20:00 – 21:30** 🍽️ **晚餐：Messina 義式冰淇淋 & 市區高空酒吧/海鮮燒烤**
  * **餐點特色**：Gelato Messina 必吃雙球冰淇淋；晚餐享用平價串燒與海鮮小吃。
  * **預算**：約 AUD $40–$55 / 人。

* **🚗 交通安排**：上午自駕回市區；下午以公車/公眾運輸與步行為主。
* **💰 當日預估花費**：約 AUD $80–$110 / 人。
* **📌 備註提醒**：岩石區市集下午 17:00 收攤，建議中午前抵達。

