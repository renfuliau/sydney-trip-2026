### 📅 Day 6：2026/10/02（五）Kiama 濱海酒莊與壯麗 Coast Walk
* **主題**：海岸酒莊品酒、海水噴泉與極致海景
* **住宿地點**：Kiama 濱海 2房2廳海景公寓

#### 🕒 詳細時間表
* **09:00 – 10:30** 🥣 **早餐：The Hungry Monkey Kiama**
  * **推薦餐點**：豪華海鮮歐姆蛋、手作美式漢堡（可選雞肉/魚排）。
  * **預算**：約 AUD $22–$30 / 人。
* **10:30 – 12:30** 📸 **景點 1：Little Blowhole & Kiama Coast Walk 濱海步道**
  * **停留時間**：2 小時。
  * **特色**：比起大噴水洞，Little Blowhole 噴水頻率更高！沿著海崖散步拍下震撼海浪。
* **13:00 – 15:30** 🍽️ **午餐 & 景點 2：Crooked River Wines 濱海酒莊** ⚠️ *建議預約*
  * **特色**：結合太平洋海景與山丘葡萄園的絕美酒莊！
  * **餐點特色**：頂級香煎干貝、野生海鱸魚搭配在地白葡萄酒。
  * **預算**：約 AUD $60–$85 / 人。
* **16:00 – 18:00** 📸 **景點 3：Cathedral Rocks（教堂岩）**
  * **停留時間**：1–1.5 小時。
  * **特色**：玄武岩柱屹立於海浪中，是攝影愛好者的絕佳取景點。
* **19:00 – 21:00** 🍽️ **晚餐：Kiama 小鎮義式餐廳 (Olive & Vine)**
  * **餐點特色**：墨魚海鮮義大利麵、窯烤松露黑蕈菇披薩。
  * **預算**：約 AUD $35–$50 / 人。

* **🚗 交通安排**：Kiama 周邊短途自駕（各景點間 10–15 分鐘）。
* **💰 當日預估花費**：約 AUD $120–$160 / 人。
* **📌 備註提醒**：海岸岩石區拍照時請注意安全浪湧，切勿太靠近崖邊。

