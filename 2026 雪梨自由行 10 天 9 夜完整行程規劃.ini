  * **預算**：約 AUD $30–$40 / 人。
* **10:00 – 12:30** 📸 **景點 1：Rose Bay / Point Piper SUP 立槳划槳船體驗** ⚠️ *需預約*
  * **交通方式**：公車或自駕約 20 分鐘。
  * **停留時間**：2 小時。
  * **特色**：在平靜無波的海灣中划槳，遠眺遠處的歌劇院景緻。
* **13:00 – 14:30** 🍽️ **午餐：Coogee Pavilion**
  * **餐點特色**：海鮮比薩、烤透抽、冰涼鮮釀啤酒/調酒。
  * **預算**：約 AUD $35–$50 / 人。
* **15:00 – 17:30** 📸 **景點 2：Coogee Beach & Coastal Walk 散步**
  * **停留時間**：2.5 小時。
  * **特色**：比起 Bondi，Coogee 人潮更少且擁有美麗的海洋泳池（Giles Baths）。
* **18:30 – 21:00** 🍽️ **晚餐：AALIA Restaurant (Martin Place)** ⚠️ *必須預約*
  * **餐點特色**：帽子餐廳！頂級中東地中海海鮮料理，如烤黃尾魚、香料烤雞、蔬食塔（無牛羊，口感層次極豐富）。
  * **預算**：約 AUD $90–$130 / 人。

* **🚗 交通安排**：市區公車/搭車或自駕（前往海灘段自駕較方便）。
* **💰 當日預估花費**：約 AUD $180–$240 / 人（含 SUP 租借費用約 AUD $50–$60）。
* **📌 備註提醒**：划槳船體驗請準備換洗衣物與防曬乳。

