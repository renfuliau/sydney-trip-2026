### 📅 Day 2：2026/09/28（日）全員會合！市區地標巡禮與微風漫步
* **主題**：迎接 Patty！經典大樓、歌劇院與百年建築
* **住宿地點**：Vicky 市區家（雪梨市區）

#### 🕒 詳細時間表
* **09:00 – 10:30** 🥣 **早餐：The Grounds of the City**
  * **推薦餐點**：Smashed Avocado（酪梨吐司佐水波蛋）、Flat White 澳式白咖啡。
  * **預算**：約 AUD $25–$30 / 人。
* **10:45 – 12:30** 🛬 **接 Patty 班機**
  * Ziv/Jan/Vicky 前往機場接 10:45 抵達的 Patty，返回市區會合放行李。
* **13:00 – 14:30** 🍽️ **午餐：Pancake On The Rocks (The Rocks)**
  * **餐點特色**：招牌烤豬腳（Pork Knuckle）、草莓香草甜鬆餅（豬肉外皮極酥脆，量大適合 4 人分享）。
  * **預算**：約 AUD $35–$45 / 人。
* **14:30 – 17:00** 📸 **景點 1：岩石區歷史街區 & 雪梨歌劇院（外觀）**
  * **交通方式**：從餐廳步行約 10 分鐘。
  * **停留時間**：2.5 小時。
  * **特色**：拍哥德式砂岩建築與歌劇院風采，可順遊 **聖瑪麗大教堂（St Mary's Cathedral）**。
* **17:30 – 19:30** 📸 **景點 2：QVB 維多利亞女王大廈購物漫步**
  * **停留時間**：1.5–2 小時。
  * **特色**：欣賞百年彩繪玻璃與世界級古董鐘。
* **20:00 – 21:30** 🍽️ **晚餐：Hurricane's Grill (Darling Harbour)** ⚠️ *需提前預約*
  * **餐點特色**：巨無霸招牌烤豬肋排（BBQ Pork Ribs）、香烤大蝦拼盤。
  * **預算**：約 AUD $55–$70 / 人。

* **🚗 交通安排**：機場接機自駕；市區步行為主。
* **💰 當日預估花費**：約 AUD $120–$150 / 人。
* **📌 備註提醒**：Hurricane's Grill 務必提前 1–2 週在官網預約熱門時段。

