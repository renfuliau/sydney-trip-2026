# 🇦🇺 2026 雪梨自由行 10 天 9 夜完整行程規劃

---

### 📅 Day 1：2026/09/27（六）雪梨初抵達與港灣微醺散步
* **主題**：抵達雪梨，迎賓海鮮與港灣夕陽
* **住宿地點**：Vicky 市區家（雪梨市區）

#### 🕒 詳細時間表
* **10:45 – 12:00** 🛬 **抵達雪梨國際機場（SYD）**
  * Ziv 與 Jan 抵達，出關後由 Vicky 開車接機返回 Vicky 市區住處放行李。
* **12:30 – 14:00** 🍽️ **午餐：Sydney Fish Market（雪梨魚市場）**
  * **餐點特色**：現切岩蠔（Sydney Rock Oysters）、蒜香海鮮起司烤龍蝦、刺身拼盤。
  * **預算**：約 AUD $40–$60 / 人。
* **14:30 – 16:30** ☕ **市區散步 & 採買自駕物資**
  * 造訪 **Darling Harbour（達令港）** 漫步拍照，並至 Woolworths 超市採買接下來自駕所需的礦泉水與零食。
* **17:00 – 19:00** 📸 **景點：麥覺理夫人椅（Mrs Macquarie's Chair）& 皇家植物園**
  * **交通方式**：搭乘市區輕軌/公車前往（約 20 分鐘）。
  * **特色與注意事項**：拍下歌劇院與雪梨港灣大橋同框的經典日落絕景。春季傍晚微涼，記得攜帶保暖外套。停留約 1.5 小時。
* **19:30 – 21:00** 🍽️ **晚餐：Chat Thai (Haymarket)**
  * **餐點特色**：極道地的泰式海鮮炒河粉（Pad Thai）、酸辣蝦湯、泰式海鮮蒸蛋（完全無牛羊成分）。
  * **預算**：約 AUD $30–$45 / 人。

* **🚗 交通安排**：機場接機自駕；市區移動搭乘輕軌 (Light Rail) / 步行。
* **💰 當日預估花費**：約 AUD $80–$110 / 人（餐飲與大眾運輸）。
* **📌 備註提醒**：今日重點為調整時差與休息，迎接收集全體成員的明天。

