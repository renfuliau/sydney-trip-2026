### 📅 Day 4：2026/09/30（二）藍山山城 ➔ 獵人谷酒莊巡禮
* **主題**：山城晨曦、開車北上與微醺酒莊風情
* **住宿地點**：獵人谷（Pokolbin 區）2房2廳度假村公寓（如 Oaks Cypress Lakes）

#### 🕒 詳細時間表
* **08:30 – 10:00** 🥣 **早餐：Katoomba 鎮上溫馨咖啡館 (如 Station Bar & Bites)**
  * **推薦餐點**：享受美式蛋捲、優格碗與手工咖啡。
  * **預算**：約 AUD $20 / 人。
* **10:00 – 10:30** 📸 **景點 1：Wentworth Falls（溫特沃斯瀑布觀景台）**
  * **停留時間**：45 分鐘。
  * **特色**：俯瞰藍山另一側懸崖瀑布景緻。
* **10:30 – 13:30** 🚗 **自駕前往獵人谷 (Hunter Valley)**（車程約 2.5–3 小時，行經景色優美的山區公路）。
* **13:30 – 15:00** 🍽️ **午餐：Hunter Valley Smelly Cheese Shop**
  * **餐點特色**：在地綜合起司盤、冰淇淋、海鮮/蔬食熟食塔，適合佐酒。
  * **預算**：約 AUD $25–$35 / 人。
* **15:30 – 18:00** 📸 **景點 2：Audrey Wilkinson / Brokenwood 酒莊試酒** ⚠️ *試酒需預約*
  * **特色**：Audrey Wilkinson 位於山丘頂端，擁有 360 度無死角葡萄園美景！享受 4–5 款 Shiraz 或 Semillon 葡萄酒品鑑。
* **18:30 – 21:00** 🍽️ **晚餐：Bimbadgen Esca 頂級酒莊餐廳** ⚠️ *需提前預約*
  * **餐點特色**：帽子餐廳等級！香煎澳洲香酥海鱸魚（Barramundi）、櫻桃鴨胸搭配當家葡萄酒。
  * **預算**：約 AUD $85–$120 / 人。

* **🚗 交通安排**：自駕約 210 公里。指定一位不喝酒的駕駛或調配試酒份量（注意酒駕標線）。
* **💰 當日預估花費**：約 AUD $140–$180 / 人。
* **📌 備註提醒**：今晚務必 21:30 前入睡，為明天凌晨的熱氣球行程補足體力！

