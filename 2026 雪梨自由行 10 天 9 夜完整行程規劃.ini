### 📅 Day 9：2026/10/05（一）伴手禮大採買、水療放鬆與離港前夜
* **主題**：藥妝伴手禮採購、日式/現代水療與市區夜景
* **住宿地點**：Vicky 市區家（雪梨市區）

#### 🕒 詳細時間表
* **09:00 – 10:30** 🥣 **早餐：Single O (Surry Hills)**
  * **推薦餐點**：手沖精品咖啡、酪梨酸面包吐司。
