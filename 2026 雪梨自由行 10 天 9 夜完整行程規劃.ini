* **住宿地點**：Vicky 市區家（雪梨市區）
* ⚠️ **特別注意**：本日凌晨 02:00 開始實施日光節約時間，時鐘撥快 1 小時（與台灣時差變為 +3 小時），請確認手機時間已自動更新！

#### 🕒 詳細時間表
* **08:30 – 09:30** 🥣 **早餐：Bill's (Surry Hills)** ⚠️ *建議預約*
