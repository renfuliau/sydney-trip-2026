### 📅 Day 5：2026/10/01（四）夢幻高空熱氣球 ➔ 南下前往 Kiama 濱海小鎮
* **主題**：獵人谷日出熱氣球、海邊巨岩與小鎮慢活
* **住宿地點**：Kiama 濱海 2房2廳海景公寓

#### 🕒 詳細時間表
* **04:00 – 08:30** 🎈 **景點 1：獵人谷日出熱氣球體驗 (Balloon Aloft)** ⚠️ *必須提前預約*
  * **時間**：04:00 集合，搭乘熱氣球升空迎接日出，俯瞰整個獵人谷葡萄園美景。
  * **早餐**：07:30 包含於體驗內的慶祝香檳早餐（Champagne Breakfast）。
* **09:30 – 11:30** 📸 **景點 2：Hunter Valley Gardens（獵人谷花園）**
  * **停留時間**：1.5–2 小時。
  * **特色**：春季百花齊放，包含義式花園與日式庭園，超好拍！
* **12:00 – 13:30** 🍽️ **午餐：The Farm Shop / Elements Restaurant**
  * **餐點特色**：地中海海鮮燉飯、香草烤雞。
  * **預算**：約 AUD $35–$50 / 人。
* **13:30 – 17:30** 🚗 **自駕南下前往 Kiama**（車程約 3.5 小時，中間可於 Wollongong 休息站稍作停靠休息）。
* **18:00 – 19:30** 📸 **景點 3：Kiama Blowhole（噴水洞）夕陽景致**
  * **停留時間**：1 小時。
  * **特色**：海水經由岩石縫隙噴出高達數十公尺的水柱，極為壯觀。
* **20:00 – 21:30** 🍽️ **晚餐：Cargo Millmann Kiama 海鮮餐館**
  * **餐點特色**：炸魚薯條（Fish & Chips）、蒜味奶油烤蝦。
  * **預算**：約 AUD $30–$40 / 人。

* **🚗 交通安排**：長途自駕約 280 公里，駕駛可交替輪替。
* **💰 當日預估花費**：約 AUD $350–$420 / 人（熱氣球體驗費用約 AUD $300–$350/人）。
* **📌 備註提醒**：熱氣球極受天候影響，如遇風大延期會全額退費。清晨飛行時氣溫較低，需穿著厚外套。

